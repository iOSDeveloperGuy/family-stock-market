name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required site files
        run: test -f index.html && test -f styles.css && test -f js/app.js
      - name: Check JavaScript syntax
        run: node --check js/app.js

