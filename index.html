<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A family-friendly fake stock-market simulator." />
    <title>Family Stock Market</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Family game night</p>
        <h1>Family Stock Market</h1>
        <p>Trade fictional companies, watch prices move, and see who can build the biggest portfolio.</p>
      </header>

      <section aria-labelledby="market-heading">
        <div class="section-heading">
          <h2 id="market-heading">Today’s market</h2>
          <button id="advance-day" type="button">Advance one day</button>
        </div>
        <div id="market" class="market-grid"></div>
      </section>
    </main>
  </body>
</html>
